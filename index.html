<!DOCTYPE html>

<style>

<div id="over"><div><h1>MINI GTA 3D</h1><p>Clicca per giocare</p><p>WASD muovi · mouse guarda · click spara · Shift corri · Spazio salta/freno a mano</p><p>F sali/scendi dall'auto · 1/2/3 armi · R ricarica</p><p>Ruba un'auto e porta i pacchi al faro per guadagnare soldi.<br>Attento alla polizia!</p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n),rf=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>v<a?a:v>b?b:v;
const angd=(a,b)=>{let d=(a-b)%(2*Math.PI);if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;return d};
const renderer=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(),skyC=new THREE.Color(0x87b5e8);scene.background=skyC;scene.fog=new THREE.Fog(0x87b5e8,80,430);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,600);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const hemi=new THREE.HemisphereLight(0xbfd8ff,0x556644,.8);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff0d0,1);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:320});sun.shadow.bias=-.0006;scene.add(sun,sun.target);
const flash=new THREE.PointLight(0xff8830,0,70);scene.add(flash);
const mfl=new THREE.PointLight(0xffd070,0,12);scene.add(mfl);
const spot=new THREE.SpotLight(0xfff2cc,0,70,.5,.5,1);scene.add(spot,spot.target);

// ---------- MATERIALI ----------
const matCache={};
function stdMat(c,o){const k=c+JSON.stringify(o||{});return matCache[k]||(matCache[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.2},o||{})))}
function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t}
const wallTex=canvasTex(256,256,c=>{c.fillStyle='#e6e6e6';c.fillRect(0,0,256,256);
 for(let i=0;i<500;i++){c.fillStyle=`rgba(0,0,0,${Math.random()*.04})`;c.fillRect(Math.random()*256,Math.random()*256,rf(2,12),rf(2,12))}
 for(let y=0;y<4;y++)for(let x=0;x<4;x++){const px=x*64+14,py=y*64+12;c.fillStyle='#a9a9a9';c.fillRect(px-2,py-2,40,44);
  const gr=c.createLinearGradient(0,py,0,py+40);gr.addColorStop(0,'#3a5068');gr.addColorStop(1,'#16222f');c.fillStyle=gr;c.fillRect(px,py,36,40)}});
const emisTex=canvasTex(256,256,c=>{c.fillStyle='#000';c.fillRect(0,0,256,256);
 for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(Math.random()<.45){c.fillStyle=`rgb(255,${200+rnd(40)},${120+rnd(60)})`;c.fillRect(x*64+14,y*64+12,36,40)}});
const wallMats=[0xd8dce0,0xc9b79c,0xa8b4c0,0xbf8f7a,0x9aa59a,0xe0d4b8].map(c=>new THREE.MeshStandardMaterial({color:c,map:wallTex,emissiveMap:emisTex,emissive:new THREE.Color(1,.82,.5),emissiveIntensity:0,roughness:.8,metalness:.05}));
const towerMat=new THREE.MeshStandardMaterial({color:0x6f93b8,map:wallTex,emissiveMap:emisTex,emissive:new THREE.Color(1,.82,.5),emissiveIntensity:0,roughness:.3,metalness:.4});
const allWall=[...wallMats,towerMat];

// ---------- CITTA ----------
const N=6,PT=80,RW=18,BS=PT-RW,EXT=N*PT,LANE=2.8,DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
const cells={},EMPTY=[],bList=[],blocksMini=[];
function addCol(x0,z0,x1,z1,h){const b={x0,z0,x1,z1,h};for(let i=Math.floor(x0/PT);i<=Math.floor(x1/PT);i++)for(let j=Math.floor(z0/PT);j<=Math.floor(z1/PT);j++){const k=i+','+j;(cells[k]=cells[k]||[]).push(b)}}
const cellList=(x,z)=>cells[Math.floor(x/PT)+','+Math.floor(z/PT)]||EMPTY;
function push(x,z,r){let best=null;for(const b of cellList(x,z)){const px=Math.max(b.x0,Math.min(x,b.x1)),pz=Math.max(b.z0,Math.min(z,b.z1)),dx=x-px,dz=z-pz,d2=dx*dx+dz*dz;
 if(d2<r*r){let nx,nz,pen;if(d2>1e-9){const d=Math.sqrt(d2);nx=dx/d;nz=dz/d;pen=r-d}else{const l=x-b.x0,rr=b.x1-x,t=z-b.z0,bt=b.z1-z,m=Math.min(l,rr,t,bt);if(m===l){nx=-1;nz=0}else if(m===rr){nx=1;nz=0}else if(m===t){nx=0;nz=-1}else{nx=0;nz=1}pen=m+r}
 if(!best||pen>best.pen)best={nx,nz,pen}}}return best}
function hitCol(x,y,z){for(const b of cellList(x,z))if(x>b.x0&&x<b.x1&&z>b.z0&&z<b.z1&&y<b.h)return true;return false}
function los(x0,z0,x1,z1){const d=Math.hypot(x1-x0,z1-z0),n=Math.ceil(d/2);for(let i=1;i<n;i++){const s=i/n;if(hitCol(x0+(x1-x0)*s,3,z0+(z1-z0)*s))return false}return true}
function groundH(x,z){if(x<0||z<0||x>EXT||z>EXT)return 0;const a=((x%PT)+PT)%PT,b=((z%PT)+PT)%PT;return(a>RW/2&&a<PT-RW/2&&b>RW/2&&b<PT-RW/2)?.25:0}
function addBuilding(cx,cz,w,d,h,mat){const g=new THREE.BoxGeometry(w,h,d),uv=g.attributes.uv;
 for(let f=0;f<6;f++){let su,sv;if(f<2){su=d/16;sv=h/14}else if(f<4){su=sv=.01}else{su=w/16;sv=h/14}
  for(let i=f*4;i<f*4+4;i++)uv.setXY(i,uv.getX(i)*su,uv.getY(i)*sv)}
 const m=new THREE.Mesh(g,mat);m.position.set(cx,.25+h/2,cz);m.castShadow=m.receiveShadow=true;scene.add(m);
 addCol(cx-w/2,cz-d/2,cx+w/2,cz+d/2,h+.25);bList.push([cx-w/2,cz-d/2,w,d,'#'+mat.color.getHexString()])}
function inst(geo,mat,list,shadow){const m=new THREE.InstancedMesh(geo,mat,list.length),o=new THREE.Object3D();
 list.forEach((p,i)=>{o.position.set(p[0],p[1],p[2]);o.rotation.set(0,p[4]||0,0);o.scale.setScalar(p[3]||1);o.updateMatrix();m.setMatrixAt(i,o.matrix)});
 m.castShadow=!!shadow;m.frustumCulled=false;scene.add(m);return m}

// terreno e strade
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2400,2400).rotateX(-Math.PI/2),stdMat(0x4a6340,{roughness:1,metalness:0}));ground.position.set(EXT/2,-.02,EXT/2);ground.receiveShadow=true;scene.add(ground);
const roadTex=canvasTex(128,128,c=>{c.fillStyle='#3a3a3e';c.fillRect(0,0,128,128);for(let i=0;i<900;i++){const v=40+rnd(25);c.fillStyle=`rgb(${v},${v},${v+3})`;c.fillRect(rnd(128),rnd(128),2,2)}
 c.fillStyle='rgba(0,0,0,.12)';c.fillRect(20,0,22,128);c.fillRect(86,0,22,128);c.fillStyle='#d8d8d0';c.fillRect(5,0,3,128);c.fillRect(120,0,3,128);c.fillRect(62,20,4,60)});
roadTex.repeat.set(1,6.2);
const roadMat=new THREE.MeshStandardMaterial({map:roadTex,roughness:.95,metalness:0}),interM=stdMat(0x3c3c40,{roughness:.95,metalness:0});
const crossTex=canvasTex(128,32,c=>{c.fillStyle='rgba(235,235,230,.92)';for(let i=0;i<8;i++)c.fillRect(i*16+3,0,9,32)});
const crossMat=new THREE.MeshStandardMaterial({map:crossTex,transparent:true,roughness:.9,metalness:0,polygonOffset:true,polygonOffsetFactor:-2,depthWrite:false});
const gV=new THREE.PlaneGeometry(RW,PT-RW).rotateX(-Math.PI/2),gH=gV.clone().rotateY(Math.PI/2),gI=new THREE.PlaneGeometry(RW,RW).rotateX(-Math.PI/2);
const cwList=[];
for(let i=0;i<=N;i++)for(let j=0;j<=N;j++){const x=i*PT,z=j*PT;
 let m=new THREE.Mesh(gI,interM);m.position.set(x,.01,z);m.receiveShadow=true;scene.add(m);
 if(j<N){m=new THREE.Mesh(gV,roadMat);m.position.set(x,.01,z+PT/2);m.receiveShadow=true;scene.add(m);cwList.push([x,.03,z+11,1,0]);}
 if(j>0)cwList.push([x,.03,z-11,1,0]);
 if(i<N){m=new THREE.Mesh(gH,roadMat);m.position.set(x+PT/2,.01,z);m.receiveShadow=true;scene.add(m);cwList.push([x+11,.03,z,1,Math.PI/2]);}
 if(i>0)cwList.push([x-11,.03,z,1,Math.PI/2])}
inst(new THREE.PlaneGeometry(RW-3,3.2).rotateX(-Math.PI/2),crossMat,cwList,false);

// isolati
const slabM=stdMat(0x9b9b96,{roughness:.95,metalness:0}),grassM=stdMat(0x4f7a3c,{roughness:1,metalness:0}),plazaM=stdMat(0xcdbf9e,{roughness:.95,metalness:0});
const poleL=[],bulbL=[],trees=[];
function plane(w,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d).rotateX(-Math.PI/2),mat);m.position.set(x,y,z);m.receiveShadow=true;scene.add(m)}
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
 const x0=i*PT+RW/2,z0=j*PT+RW/2,cx=x0+BS/2,cz=z0+BS/2;
 const slab=new THREE.Mesh(new THREE.BoxGeometry(BS,.25,BS),slabM);slab.position.set(cx,.125,cz);slab.receiveShadow=true;scene.add(slab);
 const hub=(i===3&&j===3),dc=Math.hypot(cx-EXT/2,cz-EXT/2)/(EXT/2),r=Math.random();let type='b';
 if(hub)type='t';else if(r<.1)type='p';else if(r<.18)type='z';
 blocksMini.push([x0,z0,type]);
 for(let k=0;k<4;k++){const u=14+k*(BS-28)/3;for(const q of[[x0+u,z0+1.4],[x0+u,z0+BS-1.4],[x0+1.4,z0+u],[x0+BS-1.4,z0+u]]){poleL.push([q[0],3.85,q[1]]);bulbL.push([q[0],7.5,q[1]])}}
 if(type==='t'){addBuilding(cx,cz,34,34,125,towerMat);plane(BS-4,BS-4,plazaM,cx,.26,cz)}
 else if(type==='p'){plane(BS-4,BS-4,grassM,cx,.27,cz);plane(4,BS-4,plazaM,cx,.28,cz);plane(BS-4,4,plazaM,cx,.28,cz);
  for(let k=0;k<30;k++){const tx=x0+6+Math.random()*(BS-12),tz=z0+6+Math.random()*(BS-12);if(Math.abs(tx-cx)<3.5||Math.abs(tz-cz)<3.5)continue;trees.push([tx,tz,rf(.9,1.5)]);addCol(tx-.4,tz-.4,tx+.4,tz+.4,6)}}
 else if(type==='z'){plane(BS-4,BS-4,plazaM,cx,.26,cz);const m=new THREE.Mesh(new THREE.BoxGeometry(3,12,3),stdMat(0x8a8a90));m.position.set(cx,6.25,cz);m.castShadow=true;scene.add(m);addCol(cx-1.5,cz-1.5,cx+1.5,cz+1.5,12)}
 else{const lot=(BS-13)/2;for(let a=0;a<2;a++)for(let b=0;b<2;b++){if(Math.random()<.1)continue;
  const lx=x0+5+a*(lot+3)+lot/2,lz=z0+5+b*(lot+3)+lot/2,w=rf(16,lot),d=rf(16,lot),h=rf(10,26)+(1-dc)*rf(0,55)*(Math.random()<.6?1:.3);
  addBuilding(lx+rf(-1,1),lz+rf(-1,1),w,d,h,wallMats[rnd(wallMats.length)])}}}
const bulbMat=new THREE.MeshBasicMaterial({color:0x777777});
inst(new THREE.CylinderGeometry(.1,.14,7.2,6),stdMat(0x444448),poleL,true);inst(new THREE.SphereGeometry(.38,8,6),bulbMat,bulbL,false);
inst(new THREE.CylinderGeometry(.25,.3,2.4,6),stdMat(0x5a3d22,{roughness:1}),trees.map(t=>[t[0],1.45,t[1],t[2]]),true);
inst(new THREE.IcosahedronGeometry(2.2,1),stdMat(0x2f6d2c,{roughness:1,metalness:0}),trees.map(t=>[t[0],.25+2.4+1.7*t[2],t[1],t[2]]),true);
// foresta ai bordi
const forest=[];for(let k=-30;k<=EXT+30;k+=4){for(const o of[13,22,31]){const e=o+rf(-3,3);forest.push([-e,5,k+rf(-2,2),rf(.8,1.5)],[EXT+e,5,k+rf(-2,2),rf(.8,1.5)],[k+rf(-2,2),5,-e,rf(.8,1.5)],[k+rf(-2,2),5,EXT+e,rf(.8,1.5)])}}
inst(new THREE.ConeGeometry(3,10,6),stdMat(0x23501f,{roughness:1,metalness:0}),forest,false);
addCol(-31,-31,-11,EXT+31,40);addCol(EXT+11,-31,EXT+31,EXT+31,40);addCol(-11,-31,EXT+11,-11,40);addCol(-11,EXT+11,EXT+11,EXT+31,40);

// minimappa statica
const mmS=document.createElement('canvas');mmS.width=mmS.height=EXT+60;(function(){const c=mmS.getContext('2d');c.fillStyle='#2a4f27';c.fillRect(0,0,EXT+60,EXT+60);
 c.fillStyle='#3a3a3e';for(let i=0;i<=N;i++){c.fillRect(i*PT-RW/2+30,-RW/2+30,RW,EXT+RW);c.fillRect(-RW/2+30,i*PT-RW/2+30,EXT+RW,RW)}
 for(const[x,z,t]of blocksMini){c.fillStyle=t==='p'?'#4f7a3c':t==='z'?'#cdbf9e':'#8e8e8a';c.fillRect(x+30,z+30,BS,BS)}
 for(const[x,z,w,d,col]of bList){c.fillStyle=col;c.fillRect(x+30,z+30,w,d)}})();

// ---------- OGGETTI 3D ----------
const boxG=new THREE.BoxGeometry(1,1,1),cylG=new THREE.CylinderGeometry(.35,.35,.25,14).rotateZ(Math.PI/2);
function bx(p,mat,sx,sy,sz,x,y,z,sh){const m=new THREE.Mesh(boxG,mat);m.scale.set(sx,sy,sz);m.position.set(x,y,z);m.castShadow=sh!==false;p.add(m);return m}
const glassM=stdMat(0x111a24,{roughness:.1,metalness:.6}),tyreM=stdMat(0x151515,{roughness:.9,metalness:0}),darkM=stdMat(0x1a1a1c,{roughness:.7}),burntM=stdMat(0x1c1c1e,{roughness:1,metalness:0});
const headM=new THREE.MeshBasicMaterial({color:0xfff2c0}),tailM=new THREE.MeshBasicMaterial({color:0xaa1111});
const COL=[0xc83232,0x325ac8,0xe6c832,0x3caa5a,0xd2d2d7,0xf08220,0x2d2d32,0x963ca0,0x28a0aa];
const KINDS={berlina:{bh:.55,ch:.5,cl:2.1,cz:-.15,len:4.4,vmax:40},suv:{bh:.75,ch:.65,cl:2.5,cz:-.3,len:4.7,vmax:36},sport:{bh:.45,ch:.4,cl:1.7,cz:-.1,len:4.3,vmax:52},polizia:{bh:.55,ch:.5,cl:2.1,cz:-.15,len:4.5,vmax:46}};
const OFFS=[-1.5,0,1.5],cars=[],peds=[];
function addCar(x,z,ang,col,kind,modo){const K=KINDS[kind],g=new THREE.Group(),paint=stdMat(col,{roughness:.35,metalness:.35});
 bx(g,paint,1.9,K.bh,K.len,0,.32+K.bh/2,0);bx(g,glassM,1.72,K.ch,K.cl,0,.32+K.bh+K.ch/2,K.cz);bx(g,paint,1.76,.07,K.cl*.9,0,.32+K.bh+K.ch+.03,K.cz);
 bx(g,darkM,1.96,.22,.18,0,.45,K.len/2);bx(g,darkM,1.96,.22,.18,0,.45,-K.len/2);
 for(const s of[-1,1]){bx(g,headM,.4,.14,.06,s*.65,.68,K.len/2+.02,false);bx(g,tailM,.4,.14,.06,s*.65,.68,-K.len/2-.02,false);
  for(const zz of[-1,1]){const w=new THREE.Mesh(cylG,tyreM);w.position.set(s*.95,.35,zz*K.len*.32);w.castShadow=true;g.add(w)}}
 const c={mesh:g,x,z,y:0,ang,vx:0,vz:0,hp:kind==='polizia'?150:100,fire:0,wreck:false,wt:0,modo,kind,vmax:K.vmax,a:0,b:0,d:0,nd:0,t:0,vel:0,cr:10,ferma:0,paz:0,incastro:0,retro:0,retros:1,los:false,lost:0,cd:0,smoke:0,leave:0,lr:null,lb:null};
 if(kind==='polizia'){bx(g,darkM,1.92,.2,2.2,0,.55,0);c.lr=bx(g,new THREE.MeshBasicMaterial({color:0xff2020}),.5,.12,.3,-.35,.32+K.bh+K.ch+.12,K.cz,false);c.lb=bx(g,new THREE.MeshBasicMaterial({color:0x2050ff}),.5,.12,.3,.35,.32+K.bh+K.ch+.12,K.cz,false)}
 g.position.set(x,0,z);g.rotation.y=ang;scene.add(g);cars.push(c);return c}
function makePed(shirt,skin,pant,gun){const g=new THREE.Group(),sm=stdMat(shirt,{roughness:.8,metalness:0}),pm_=stdMat(pant,{roughness:.8,metalness:0}),sk=stdMat(skin,{roughness:.8,metalness:0});
 const mkLeg=x=>{const l=new THREE.Group();l.position.set(x,.85,0);bx(l,pm_,.2,.85,.22,0,-.425,0);g.add(l);return l};
 const legL=mkLeg(.12),legR=mkLeg(-.12);bx(g,sm,.46,.62,.26,0,1.17,0);
 const mkArm=x=>{const a=new THREE.Group();a.position.set(x,1.45,0);bx(a,sm,.14,.62,.16,0,-.31,0);g.add(a);return a};
 const armL=mkArm(.31),armR=mkArm(-.31);bx(g,sk,.24,.26,.24,0,1.62,0);bx(g,darkM,.26,.08,.26,0,1.77,0);
 let gm=null;if(gun){gm=bx(armR,darkM,.07,.3,.1,0,-.66,.04);gm.visible=false}
 g.userData={legL,legR,armL,armR,gun:gm};scene.add(g);return g}
const PELLI=[0xebc3a0,0xc8966e,0x96644a,0x5f412d],MAGL=[0xc83c3c,0x3c5ac8,0xe6c83c,0x46aa5a,0xe6e6e6,0xa046aa,0xf08c28,0x32323a],PANT=[0x2a3550,0x333333,0x4a3b2a,0x1d2b3d];

const marker=new THREE.Mesh(new THREE.CylinderGeometry(3.5,3.5,60,16,1,true),new THREE.MeshBasicMaterial({color:0xffd23c,transparent:true,opacity:.3,depthWrite:false,side:THREE.DoubleSide}));marker.position.y=30;scene.add(marker);
function newMission(){let x,z;for(let n=0;n<60;n++){x=rnd(N+1)*PT;z=rnd(N+1)*PT;const d=Math.hypot(x-G.x,z-G.z);if(d>120&&d<320)break}mission={st:'ritiro',x,z,tempo:0,pausa:0,dist:0}}
function updMission(dt){const m=mission;if(m.st==='attesa'){m.pausa-=dt;if(m.pausa<=0)newMission();return}
 const d=Math.hypot(m.x-G.x,m.z-G.z);
 if(m.st==='ritiro'){if(d<6){if(G.car){let bx_,bz_;for(let n=0;n<60;n++){bx_=rnd(N+1)*PT;bz_=rnd(N+1)*PT;const dd=Math.hypot(bx_-m.x,bz_-m.z);if(dd>150&&dd<350)break}
   const dist=Math.hypot(bx_-m.x,bz_-m.z);Object.assign(m,{st:'consegna',x:bx_,z:bz_,dist,tempo:dist/12+30});msg('Pacco caricato! Portalo al faro verde',3)}else if(msgT<=0)msg("Ti serve un'auto per il ritiro!",2)}}
 else{m.tempo-=dt;if(d<6&&G.car){const pr=Math.floor(150+m.dist*.8+m.tempo*4);G.money+=pr;G.consegne++;msg('Consegna completata! +$'+pr,4);Object.assign(m,{st:'attesa',pausa:4})}
  else if(m.tempo<=0){msg('Tempo scaduto! Consegna fallita',4);Object.assign(m,{st:'attesa',pausa:3})}}}

// ---------- UPDATE ----------
function update(dt){T+=dt;hour=(10+T/480*24)%24;
 for(const k of['fcd','imm'])G[k]=Math.max(0,G[k]-dt);G.cd=Math.max(0,G.cd-dt);G.aimT=Math.max(0,G.aimT-dt);rumore=Math.max(0,rumore-dt);flashT=Math.max(0,flashT-dt);msgT=Math.max(0,msgT-dt);
 spPed-=dt;spTra-=dt;spPol-=dt;G.noDmg+=dt;cam.shake*=Math.max(0,1-5*dt);flash.intensity*=Math.max(0,1-6*dt);mfl.intensity*=Math.max(0,1-30*dt);
 if(G.noDmg>8&&G.hp<100&&!fine)G.hp=Math.min(100,G.hp+1.5*dt);
 if(G.ric>0){G.ric-=dt;if(G.ric<=0){G.ric=0;G.ammo[G.w]=ARMI[G.w].mag}}
 const W=keys.has('KeyW')||keys.has('ArrowUp'),S_=keys.has('KeyS')||keys.has('ArrowDown'),A=keys.has('KeyA')||keys.has('ArrowLeft'),D=keys.has('KeyD')||keys.has('ArrowRight');
 const wp=ARMI[G.w];if(!fine&&mouseDown&&(wp.auto||clicked))shoot();clicked=false;
 const car=G.car;
 if(!car&&!fine){const fw=(W?1:0)-(S_?1:0),st=(D?1:0)-(A?1:0),sy=Math.sin(cam.yaw),cy=Math.cos(cam.yaw);let mx=sy*fw-cy*st,mz=cy*fw+sy*st;const n=Math.hypot(mx,mz),v=keys.has('ShiftLeft')?6.5:3.4;
  if(n){G.x+=mx/n*v*dt;G.z+=mz/n*v*dt;G.walk+=v*dt*2.4}
  for(let i=0;i<2;i++){const r=push(G.x,G.z,.3);if(r){G.x+=r.nx*r.pen;G.z+=r.nz*r.pen}}
  for(const c of cars){if(Math.abs(c.x-G.x)>3.5||Math.abs(c.z-G.z)>3.5)continue;const sn=Math.sin(c.ang),cs=Math.cos(c.ang);for(const o of OFFS){const ex=G.x-(c.x+sn*o),ez=G.z-(c.z+cs*o),d=Math.hypot(ex,ez);if(d>0&&d<1.3){G.x+=ex/d*(1.3-d);G.z+=ez/d*(1.3-d)}}}
  G.x=cl(G.x,-8,EXT+8);G.z=cl(G.z,-8,EXT+8);
  const gh=groundH(G.x,G.z);if(keys.has('Space')&&G.y<=gh+.01&&G.vy===0)G.vy=5.2;G.vy-=14*dt;G.y+=G.vy*dt;if(G.y<=gh){G.y=gh;G.vy=0}
  const ta=(G.aimT>0)?cam.yaw:(n?Math.atan2(mx,mz):G.ang);G.ang+=angd(ta,G.ang)*Math.min(1,12*dt)}
 if(car&&!fine){const acc=(W?1:0)-(S_?1:0),ster=cl((D?1:0)-(A?1:0),-1,1);physCar(car,acc,ster,keys.has('Space'),dt)}
 // auto
 for(let i=cars.length-1;i>=0;i--){const c=cars[i];let imp=0;
  if(c.wreck){c.wt+=dt;physCar(c,0,0,true,dt);wallCar(c);if(c.wt>30||Math.hypot(c.x-G.x,c.z-G.z)>250){removeCar(c);continue}}
  else{if(c===car){imp=wallCar(c);G.x=c.x;G.z=c.z;G.y=c.y}
   else if(c.modo==='ai')aiCar(c,dt);else if(c.modo==='pol'){polCar(c,dt);imp=wallCar(c)}
   else if(Math.abs(c.vx)+Math.abs(c.vz)>.05){physCar(c,0,0,true,dt);imp=wallCar(c)}
   if(imp>3){c.hp-=(imp-3)*3;if(c===car){cam.shake=Math.max(cam.shake,Math.min(.5,imp*.03));bang(.4,.3,300)}}
   const vel=Math.hypot(c.vx,c.vz);
   if(vel>3&&c!==car&&!car&&!fine&&G.imm<=0&&Math.hypot(c.x-G.x,c.z-G.z)<1.6){hurt((vel-2)*5);G.imm=.6;G.x+=c.vx*.06;G.z+=c.vz*.06}
   if(vel>2.8){for(const p of peds){if(p.dead||Math.abs(p.x-c.x)>3||Math.abs(p.z-c.z)>3)continue;const sn=Math.sin(c.ang),cs=Math.cos(c.ang);
     for(const o of OFFS)if(Math.hypot(p.x-(c.x+sn*o),p.z-(c.z+cs*o))<1.3){killPed(p,c===car);c.vx*=.97;c.vz*=.97;break}}}
   if(c.hp<=0&&c.fire<=0){c.fire=2.5+Math.random()*1.5;if(c===car){exitCar();hurt(10)}c.modo='fis'}
   if(c.fire>0){c.fire-=dt;c.smoke-=dt;if(c.smoke<=0){c.smoke=.05;emit(c.x,1.2,c.z,rf(-.5,.5),rf(2,4),rf(-.5,.5),.8,.6,Math.random()<.5?0xff7010:0x222222,1.5,0)}
    if(c.fire<=0){c.wreck=true;c.wt=0;boom(c.x,c.z);c.mesh.traverse(m=>{if(m.isMesh)m.material=burntM})}}
   else if(c.hp<45){c.smoke-=dt;if(c.smoke<=0){c.smoke=.15;emit(c.x+Math.sin(c.ang)*1.5,1,c.z+Math.cos(c.ang)*1.5,rf(-.3,.3),rf(1,2),rf(-.3,.3),1,.4,0x555555,1.2,0)}}
   if(c.leave>0){c.leave-=dt;if(c.leave<=0&&Math.hypot(c.x-G.x,c.z-G.z)>40){removeCar(c);continue}}
   if(c.modo!=='player'&&c.modo!=='pol'&&Math.hypot(c.x-G.x,c.z-G.z)>270&&c.leave<=0){removeCar(c);continue}}
  c.y+=(groundH(c.x,c.z)-c.y)*Math.min(1,10*dt);c.mesh.position.set(c.x,c.y,c.z);c.mesh.rotation.y=c.ang;
  if(c.lr){const f=Math.floor(T*6)%2;c.lr.visible=!!f&&!c.wreck;c.lb.visible=!f&&!c.wreck}}
 for(let i=0;i<cars.length;i++){const a=cars[i];for(let j=i+1;j<cars.length;j++){const b=cars[j];if(Math.abs(a.x-b.x)<5&&Math.abs(a.z-b.z)<5)urto(a,b)}}
 // pedoni
 for(let i=peds.length-1;i>=0;i--){const p=peds[i],dg=Math.hypot(p.x-G.x,p.z-G.z);
  if(p.dead){p.dt+=dt;if(p.dt>15||dg>120){scene.remove(p.mesh);peds.splice(i,1)}continue}
  if(((rumore>0&&dg<16)||(car&&Math.hypot(car.vx,car.vz)>8&&dg<7))&&p.fuga<=0){p.fuga=3.5;p.ang=Math.atan2(p.x-G.x,p.z-G.z)+rf(-.6,.6)}
  let v;if(p.fuga>0){p.fuga-=dt;v=5}else{p.cd-=dt;if(p.cd<=0){p.cd=rf(1.5,5);p.ang=rf(0,6.28);p.v=[0,1.2,1.5,1.9][rnd(4)]}v=p.v}
  let nx=p.x+Math.sin(p.ang)*v*dt,nz=p.z+Math.cos(p.ang)*v*dt;const r=push(nx,nz,.25);if(r){nx+=r.nx*r.pen;nz+=r.nz*r.pen;p.ang=rf(0,6.28)}
  p.x=cl(nx,-8,EXT+8);p.z=cl(nz,-8,EXT+8);p.ph+=v*dt*2.4;const u=p.mesh.userData,s=Math.sin(p.ph)*(v>0?.7:0);u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s*.7;u.armR.rotation.x=s*.7;
  p.mesh.position.set(p.x,groundH(p.x,p.z),p.z);p.mesh.rotation.y=p.ang;if(dg>130){scene.remove(p.mesh);peds.splice(i,1)}}
 if(peds.length<36&&spPed<=0){spawnPed(15,70);spPed=.25}
 if(cars.filter(c=>c.modo==='ai').length<16&&spTra<=0){spawnTraffic(90,200);spTra=.6}
 // giocatore: modello
 pm.position.set(G.x,G.y,G.z);pm.rotation.y=G.ang;{const u=pm.userData,mv=!car&&(W||S_||A||D),s=Math.sin(G.walk)*(mv?.7:0);u.legL.rotation.x=s;u.legR.rotation.x=-s;u.armL.rotation.x=-s*.7;
  if(G.aimT>0){u.armR.rotation.x=-1.45;u.gun.visible=true}else{u.armR.rotation.x=s*.7;u.gun.visible=false}}
 // ricercato
 G.stars=G.wanted>.001?Math.ceil(G.wanted-1e-6):0;const pol=cars.filter(c=>c.modo==='pol'&&!c.wreck);
 if(G.stars>0){const vic=pol.some(c=>Math.hypot(c.x-G.x,c.z-G.z)<25);G.wanted-=(vic?.02:.1)*dt;if(pol.length<Math.min(5,G.stars+1)&&spPol<=0){spawnPolice();spPol=3}}
 else{G.wanted=0;for(const c of pol){c.modo='fis';c.leave=10}}
 let near=false;if(G.stars>0&&!fine){const sp=car?Math.hypot(car.vx,car.vz):0;for(const c of pol)if(Math.hypot(c.x-G.x,c.z-G.z)<3.4&&sp<3)near=true}
 G.arr=near?G.arr+dt/2.2:Math.max(0,G.arr-dt*.8);if(G.arr>=1&&!fine){fine='ARRESTATO';if(car)exitCar()}
 if(!fine)updMission(dt);
 if(G.hp<=0&&!fine){fine='WASTED';if(G.car)exitCar()}
 if(fine){$('endt').textContent=fine;$('endt').style.color=fine==='WASTED'?'#ff3030':'#5080ff';$('end').style.display='flex'}
 updParts(dt);for(const t of tracers)if(t.t>0){t.t-=dt;t.l.material.opacity=Math.max(0,t.t/.07);if(t.t<=0)t.l.visible=false}
 // audio
 if(AC){if(car){const sp=Math.hypot(car.vx,car.vz);eng.o.frequency.value=45+sp*3.6;eng.f.frequency.value=300+sp*20;eng.g.gain.value=.05+Math.min(.07,sp*.003)}else eng.g.gain.value=0;
  const sirOn=G.stars>0&&pol.some(c=>Math.hypot(c.x-G.x,c.z-G.z)<90);sir.g.gain.value=sirOn?.015:0;sir.o.frequency.value=Math.floor(T*2)%2?720:560}}

// ---------- RENDER ----------
const cSky=new THREE.Color(),cNight=new THREE.Color(.03,.05,.12),cDay=new THREE.Color(.53,.72,.92),cDusk=new THREE.Color(.95,.5,.3),cWarm=new THREE.Color(1,.58,.3),cWhite=new THREE.Color(1,.94,.82);
function skyUpdate(){const a=(hour-6)/12*Math.PI,el=Math.sin(a),day=cl((el+.12)/.5,0,1),dus=Math.exp(-Math.pow(el/.2,2))*.55;
 cSky.copy(cNight).lerp(cDay,day).lerp(cDusk,dus);skyC.copy(cSky);scene.fog.color.copy(cSky);
 hemi.intensity=.2+.65*day;sun.intensity=.1+1.05*day;sun.color.copy(cWhite).lerp(cWarm,dus*1.4);
 sun.position.set(G.x+Math.cos(a)*90,30+Math.max(el,.1)*90,G.z+30);sun.target.position.set(G.x,0,G.z);
 const night=Math.max(0,1-day-.1);for(const m of allWall)m.emissiveIntensity=night*1.3;bulbMat.color.setHex(night>.2?0xffe9a8:0x777777);
 spot.intensity=G.car?night*2.2:0}
function camUpdate(dt){const c=G.car,tx=c?c.x:G.x,ty=(c?c.y:G.y)+(c?1.3:1.5),tz=c?c.z:G.z,dist=c?8.5:3.6,side=c?0:.8;
 if(c){const sp=Math.hypot(c.vx,c.vz);if(sp>3)cam.yaw+=angd(c.ang,cam.yaw)*Math.min(1,2.2*dt)}
 const cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),ox=-Math.sin(cam.yaw)*cp*dist,oy=sp*dist,oz=-Math.cos(cam.yaw)*cp*dist,rx=-Math.cos(cam.yaw)*side,rz=Math.sin(cam.yaw)*side;
 let f=1;for(let i=1;i<=10;i++){const s=i/10,x=tx+(ox+rx)*s,y=ty+oy*s,z=tz+(oz+rz)*s;if(y<.3||hitCol(x,y,z)){f=Math.max(.12,(i-1)/10);break}}
 cam.f+=(f-cam.f)*Math.min(1,(f<cam.f?20:4)*dt);
 camera.position.set(tx+(ox+rx)*cam.f+rf(-1,1)*cam.shake*.3,ty+oy*cam.f+rf(-1,1)*cam.shake*.3,tz+(oz+rz)*cam.f+rf(-1,1)*cam.shake*.3);
 const lx=Math.sin(cam.yaw)*cp,ly=-sp,lz=Math.cos(cam.yaw)*cp;camera.lookAt(camera.position.x+lx*20,camera.position.y+ly*20,camera.position.z+lz*20);
 const fov=65+(c?Math.min(15,Math.hypot(c.vx,c.vz)*.4):0);if(Math.abs(camera.fov-fov)>.05){camera.fov+=(fov-camera.fov)*Math.min(1,4*dt);camera.updateProjectionMatrix()}
 if(c){spot.position.set(c.x+Math.sin(c.ang)*2.5,.9,c.z+Math.cos(c.ang)*2.5);spot.target.position.set(c.x+Math.sin(c.ang)*25,0,c.z+Math.cos(c.ang)*25)}}
const mc=$('mini').getContext('2d');
function drawMini(){mc.clearRect(0,0,180,180);mc.save();mc.beginPath();mc.arc(90,90,90,0,6.2832);mc.clip();mc.fillStyle='#111';mc.fillRect(0,0,180,180);
 mc.translate(90,90);mc.rotate(cam.yaw+Math.PI);mc.translate(-(G.x+30),-(G.z+30));mc.drawImage(mmS,0,0);
 for(const c of cars)if(c.modo==='pol'&&!c.wreck){mc.fillStyle=Math.floor(T*4)%2?'#3060ff':'#ff3030';mc.beginPath();mc.arc(c.x+30,c.z+30,4,0,6.3);mc.fill()}
 if(mission&&mission.st!=='attesa'){mc.fillStyle=mission.st==='ritiro'?'#ffd23c':'#40e060';mc.strokeStyle='#000';mc.beginPath();mc.arc(mission.x+30,mission.z+30,6,0,6.3);mc.fill();mc.stroke()}
 mc.restore();mc.fillStyle='#fff';mc.strokeStyle='#000';mc.lineWidth=1.5;mc.beginPath();mc.moveTo(90,80);mc.lineTo(95,96);mc.lineTo(85,96);mc.closePath();mc.fill();mc.stroke()}
function hud(){$('money').textContent='$ '+G.money;$('hp').style.width=cl(G.hp,0,100)+'%';$('stars').textContent='★'.repeat(G.stars)+'☆'.repeat(5-G.stars);
 $('arrb').style.display=G.arr>0?'block':'none';$('arr').style.width=Math.min(100,G.arr*100)+'%';
 const w=ARMI[G.w];$('weapon').textContent=G.car?'':(G.ric>0?'RICARICA...':w.n+'  '+G.ammo[G.w]+'/'+w.mag);
 $('speed').textContent=G.car?Math.round(Math.hypot(G.car.vx,G.car.vz)*3.6)+' km/h  |  AUTO '+Math.max(0,G.car.hp|0)+'%':'';
 $('cross').style.display=G.car?'none':'block';$('msg').style.opacity=msgT>0?1:0;
 const m=mission;$('mission').textContent=!m?'':m.st==='ritiro'?'MISSIONE: vai al faro giallo IN AUTO ('+Math.round(Math.hypot(m.x-G.x,m.z-G.z))+' m)':m.st==='consegna'?'CONSEGNA: '+Math.round(Math.hypot(m.x-G.x,m.z-G.z))+' m   tempo '+Math.max(0,m.tempo|0)+' s':'Prossima missione in arrivo...';
 $('mission').style.color=m&&m.st==='consegna'?'#40e060':'#ffd23c';
 $('clock').textContent=String(hour|0).padStart(2,'0')+':'+String((hour%1*60)|0).padStart(2,'0');
 if(mission&&mission.st!=='attesa'){marker.visible=true;marker.position.set(mission.x,30,mission.z);marker.material.color.setHex(mission.st==='ritiro'?0xffd23c:0x40e060)}else marker.visible=false}

// ---------- INPUT ----------
addEventListener('keydown',e=>{if(e.code==='Space')e.preventDefault();if(e.repeat)return;keys.add(e.code);if(paused)return;
 if(e.code==='KeyF')toggleCar();else if(e.code==='KeyR'){if(fine)respawn();else reload()}
 else if(e.code==='Digit1'||e.code==='Digit2'||e.code==='Digit3'){G.w=+e.code[5]-1;G.ric=0}});
addEventListener('keyup',e=>keys.delete(e.code));
$('over').addEventListener('click',()=>{audio();renderer.domElement.requestPointerLock()});
document.addEventListener('pointerlockchange',()=>{paused=document.pointerLockElement!==renderer.domElement;$('over').style.display=paused?'flex':'none';if(paused){keys.clear();mouseDown=false}});
addEventListener('mousemove',e=>{if(paused)return;cam.yaw-=e.movementX*.0022;cam.pitch=cl(cam.pitch+e.movementY*.0022,-.35,1.1)});
addEventListener('mousedown',e=>{if(!paused&&e.button===0){mouseDown=true;clicked=true}});addEventListener('mouseup',()=>{mouseDown=false});

// ---------- AVVIO ----------
addCar(86.8,93,0,0xc83232,'sport','fis');parkCars(30);for(let i=0;i<10;i++)spawnTraffic(40,220);for(let i=0;i<24;i++)spawnPed(8,70);newMission();
msg("Avvicinati a un'auto e premi F per salire",6);
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(!paused)update(dt);skyUpdate();camUpdate(dt);hud();drawMini();renderer.render(scene,camera)})(last);
