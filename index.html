<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assistente</title>

  <style>
    :root {
      --black: #000;
      --blue: #1683ff;
      --white: #fff;
      --gray: #aaa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--white);
      background: var(--black);
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px 20px;
      text-align: center;
      border-bottom: 1px solid var(--blue);
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      color: var(--white);
    }

    main {
      width: min(1000px, 100%);
      margin: 30px auto;
      padding: 0 20px;
    }

    .box {
      margin-bottom: 24px;
      padding: 22px;
      border: 1px solid var(--blue);
      border-radius: 12px;
      background: var(--black);
    }

    .assistant {
      text-align: center;
    }

    #voiceButton {
      width: 90px;
      height: 90px;
      border: 2px solid var(--blue);
      border-radius: 50%;
      color: var(--white);
      background: var(--black);
      font-size: 38px;
      cursor: pointer;
    }

    #voiceButton:hover,
    #voiceButton.listening {
      color: var(--blue);
      box-shadow: 0 0 20px var(--blue);
    }

    #status {
      margin-top: 18px;
      color: var(--gray);
    }

    #transcript {
      min-height: 22px;
      margin-top: 8px;
      color: var(--blue);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      color: var(--white);
      background: var(--black);
      border: 1px solid var(--blue);
      border-radius: 7px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button[type="submit"] {
      padding: 11px;
      color: var(--white);
      background: var(--black);
      border: 1px solid var(--blue);
      border-radius: 7px;
      cursor: pointer;
    }

    button[type="submit"]:hover {
      color: var(--black);
      background: var(--blue);
    }

    ul {
      padding: 0;
      margin: 18px 0 0;
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--blue);
    }

    .item-content {
      flex: 1;
      word-break: break-word;
    }

    .item-date {
      display: block;
      margin-top: 5px;
      color: var(--gray);
      font-size: 12px;
    }

    .delete-button {
      height: fit-content;
      padding: 6px 9px;
      color: var(--white);
      background: var(--black);
      border: 1px solid var(--blue);
      border-radius: 6px;
      cursor: pointer;
    }

    .delete-button:hover {
      color: var(--black);
      background: var(--blue);
    }

    .search-result {
      padding: 12px 0;
      border-bottom: 1px solid var(--blue);
    }

    .search-result a {
      color: var(--blue);
    }

    .empty {
      color: var(--gray);
    }
  </style>
</head>

<body>
  <header>
    <h1>Assistente vocale</h1>
  </header>

  <main>
    <section class="box assistant">
      <button id="voiceButton" aria-label="Avvia assistente vocale">
        🎙️
      </button>

      <div id="status">Premi il microfono</div>
      <div id="transcript"></div>
    </section>

    <section class="grid">
      <div class="box">
        <h2>Nota</h2>

        <form id="noteForm">
          <textarea
            id="noteInput"
            placeholder="Scrivi una nota"
            required
          ></textarea>

          <button type="submit">Salva</button>
        </form>

        <ul id="notesList"></ul>
      </div>

      <div class="box">
        <h2>Promemoria</h2>

        <form id="reminderForm">
          <input
            id="reminderInput"
            type="text"
            placeholder="Testo"
            required
          />

          <input
            id="reminderDate"
            type="datetime-local"
            required
          />

          <button type="submit">Salva</button>
        </form>

        <ul id="remindersList"></ul>
      </div>
    </section>

    <section class="box">
      <h2>Ricerca</h2>
      <div id="searchResults">
        <p class="empty">Nessuna ricerca</p>
      </div>
    </section>
  </main>

  <script>
    const voiceButton = document.getElementById("voiceButton");
    const statusElement = document.getElementById("status");
    const transcriptElement = document.getElementById("transcript");

    const noteForm = document.getElementById("noteForm");
    const noteInput = document.getElementById("noteInput");
    const notesList = document.getElementById("notesList");

    const reminderForm = document.getElementById("reminderForm");
    const reminderInput = document.getElementById("reminderInput");
    const reminderDate = document.getElementById("reminderDate");
    const remindersList = document.getElementById("remindersList");

    const searchResults = document.getElementById("searchResults");

    let notes = JSON.parse(localStorage.getItem("notes") || "[]");
    let reminders = JSON.parse(
      localStorage.getItem("reminders") || "[]"
    );

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = "it-IT";
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        voiceButton.classList.add("listening");
        statusElement.textContent = "Ascolto...";
        transcriptElement.textContent = "";
      };

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;

        transcriptElement.textContent = text;
        processVoiceCommand(text);
      };

      recognition.onerror = () => {
        statusElement.textContent = "Errore microfono";
      };

      recognition.onend = () => {
        voiceButton.classList.remove("listening");

        if (statusElement.textContent === "Ascolto...") {
          statusElement.textContent = "Premi il microfono";
        }
      };
    } else {
      voiceButton.disabled = true;
      statusElement.textContent = "Browser non compatibile";
    }

    voiceButton.addEventListener("click", () => {
      if (!recognition) return;

      try {
        recognition.start();
      } catch {
        // Il microfono è già attivo.
      }
    });

    function speak(message) {
      if (!("speechSynthesis" in window)) return;

      const speech = new SpeechSynthesisUtterance(message);
      speech.lang = "it-IT";

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(speech);
    }

    function saveNotes() {
      localStorage.setItem("notes", JSON.stringify(notes));
    }

    function saveReminders() {
      localStorage.setItem(
        "reminders",
        JSON.stringify(reminders)
      );
    }

    function renderNotes() {
      notesList.innerHTML = "";

      if (!notes.length) {
        notesList.innerHTML =
          '<li class="empty">Nessuna nota</li>';
        return;
      }

      notes.forEach((note) => {
        const li = document.createElement("li");

        li.innerHTML = `
          <div class="item-content">
            ${escapeHtml(note.text)}
            <span class="item-date">
              ${new Date(note.createdAt).toLocaleString("it-IT")}
            </span>
          </div>

          <button class="delete-button">
            Elimina
          </button>
        `;

        li.querySelector(".delete-button").onclick = () => {
          notes = notes.filter((item) => item.id !== note.id);
          saveNotes();
          renderNotes();
        };

        notesList.appendChild(li);
      });
    }

    function renderReminders() {
      remindersList.innerHTML = "";

      if (!reminders.length) {
        remindersList.innerHTML =
          '<li class="empty">Nessun promemoria</li>';
        return;
      }

      reminders
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .forEach((reminder) => {
          const li = document.createElement("li");

          li.innerHTML = `
            <div class="item-content">
              ${escapeHtml(reminder.text)}
              <span class="item-date">
                ${new Date(reminder.date).toLocaleString("it-IT")}
              </span>
            </div>

            <button class="delete-button">
              Elimina
            </button>
          `;

          li.querySelector(".delete-button").onclick = () => {
            reminders = reminders.filter(
              (item) => item.id !== reminder.id
            );

            saveReminders();
            renderReminders();
          };

          remindersList.appendChild(li);
        });
    }

    noteForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = noteInput.value.trim();
      if (!text) return;

      notes.push({
        id: crypto.randomUUID(),
        text,
        createdAt: new Date().toISOString()
      });

      saveNotes();
      renderNotes();

      noteInput.value = "";
      speak("Nota salvata");
    });

    reminderForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = reminderInput.value.trim();
      const date = reminderDate.value;

      if (!text || !date) return;

      reminders.push({
        id: crypto.randomUUID(),
        text,
        date,
        notified: false
      });

      saveReminders();
      renderReminders();

      reminderInput.value = "";
      reminderDate.value = "";

      speak("Promemoria salvato");
    });

    function processVoiceCommand(command) {
      const text = command.toLowerCase().trim();

      if (
        text.startsWith("crea una nota") ||
        text.startsWith("crea nota") ||
        text.startsWith("annota")
      ) {
        const note = text
          .replace(/^crea una nota\s*:?\s*/i, "")
          .replace(/^crea nota\s*:?\s*/i, "")
          .replace(/^annota\s*:?\s*/i, "")
          .trim();

        if (note) {
          notes.push({
            id: crypto.randomUUID(),
            text: note,
            createdAt: new Date().toISOString()
          });

          saveNotes();
          renderNotes();
          speak("Nota salvata");
        }

        return;
      }

      if (
        text.startsWith("ricordami") ||
        text.startsWith("crea un promemoria") ||
        text.startsWith("crea promemoria")
      ) {
        const reminderText = text
          .replace(/^ricordami\s*/i, "")
          .replace(/^crea un promemoria\s*/i, "")
          .replace(/^crea promemoria\s*/i, "")
          .replace(/^di\s*/i, "")
          .trim();

        if (reminderText) {
          reminders.push({
            id: crypto.randomUUID(),
            text: reminderText,
            date: parseItalianDate(text),
            notified: false
          });

          saveReminders();
          renderReminders();
          speak("Promemoria salvato");
        }

        return;
      }

      if (
        text.includes("leggi le note") ||
        text.includes("leggi le mie note")
      ) {
        if (!notes.length) {
          speak("Nessuna nota");
        } else {
          speak(
            notes
              .map((note) => note.text)
              .join(". ")
          );
        }

        return;
      }

      if (
        text.startsWith("cerca") ||
        text.startsWith("ricerca")
      ) {
        const query = text
          .replace(/^cerca su internet\s*/i, "")
          .replace(/^cerca\s*/i, "")
          .replace(/^ricerca\s*/i, "")
          .trim();

        if (query) {
          searchWeb(query);
        }

        return;
      }

      if (text.includes("apri youtube")) {
        window.open("https://www.youtube.com", "_blank");
        return;
      }

      if (text.includes("apri google")) {
        window.open("https://www.google.com", "_blank");
      }
    }

    function searchWeb(query) {
      const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

      const empty = searchResults.querySelector(".empty");

      if (empty) {
        empty.remove();
      }

      const result = document.createElement("div");
      result.className = "search-result";

      result.innerHTML = `
        ${escapeHtml(query)}
        <br />
        <a
          href="${url}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Apri
        </a>
      `;

      searchResults.prepend(result);
      window.open(url, "_blank");
      speak("Ricerca avviata");
    }

    function parseItalianDate(command) {
      const date = new Date();

      if (command.includes("domani")) {
        date.setDate(date.getDate() + 1);
      }

      const match = command.match(
        /alle\s+(\d{1,2})(?:[:.](\d{2}))?/
      );

      if (match) {
        date.setHours(
          Number(match[1]),
          Number(match[2] || 0),
          0,
          0
        );
      } else {
        date.setHours(date.getHours() + 1, 0, 0, 0);
      }

      return toLocalDateTime(date);
    }

    function toLocalDateTime(date) {
      const offset = date.getTimezoneOffset();
      const local = new Date(
        date.getTime() - offset * 60000
      );

      return local.toISOString().slice(0, 16);
    }

    function checkReminders() {
      const now = new Date();
      let changed = false;

      reminders.forEach((reminder) => {
        if (
          !reminder.notified &&
          new Date(reminder.date) <= now
        ) {
          reminder.notified = true;
          changed = true;

          const message =
            "Promemoria: " + reminder.text;

          if (
            "Notification" in window &&
            Notification.permission === "granted"
          ) {
            new Notification("Promemoria", {
              body: reminder.text
            });
          }

          speak(message);
          alert(message);
        }
      });

      if (changed) {
        saveReminders();
        renderReminders();
      }
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderNotes();
    renderReminders();

    setInterval(checkReminders, 10000);
    checkReminders();
  </script>
</body>
</html>
