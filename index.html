<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistente</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: white;
      background: black;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #1683ff;
    }

    h1 {
      margin: 0;
      font-size: 25px;
    }

    main {
      width: min(900px, 100%);
      margin: 30px auto;
      padding: 0 20px;
    }

    .box {
      margin-bottom: 24px;
      padding: 22px;
      border: 1px solid #1683ff;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input,
    textarea,
    button {
      font: inherit;
    }

    input,
    textarea {
      flex: 1;
      min-width: 180px;
      padding: 12px;
      color: white;
      background: black;
      border: 1px solid #1683ff;
      border-radius: 6px;
      outline: none;
    }

    textarea {
      width: 100%;
      min-height: 80px;
      resize: vertical;
    }

    button {
      padding: 11px 18px;
      color: white;
      background: black;
      border: 1px solid #1683ff;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      color: black;
      background: #1683ff;
    }

    #response {
      min-height: 24px;
      margin-top: 16px;
      color: #1683ff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    ul {
      padding: 0;
      margin: 18px 0 0;
      list-style: none;
    }

    li {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #1683ff;
    }

    .content {
      flex: 1;
      word-break: break-word;
    }

    .date {
      display: block;
      margin-top: 5px;
      color: #999;
      font-size: 12px;
    }

    .delete {
      height: fit-content;
      padding: 6px 9px;
    }

    .empty {
      color: #999;
    }

    a {
      color: #1683ff;
    }
  </style>
</head>

<body>
  <header>
    <h1>Assistente</h1>
  </header>

  <main>
    <section class="box">
      <h2>Comando</h2>

      <form id="commandForm">
        <input
          id="commandInput"
          type="text"
          placeholder="Scrivi una richiesta"
          autocomplete="off"
          required
        >

        <button type="submit">Invia</button>
      </form>

      <div id="response"></div>
    </section>

    <section class="grid">
      <div class="box">
        <h2>Nota</h2>

        <form id="noteForm">
          <textarea
            id="noteInput"
            placeholder="Scrivi una nota"
            required
          ></textarea>

          <button type="submit">Salva</button>
        </form>

        <ul id="notesList"></ul>
      </div>

      <div class="box">
        <h2>Promemoria</h2>

        <form id="reminderForm">
          <input
            id="reminderInput"
            type="text"
            placeholder="Testo"
            required
          >

          <input
            id="reminderDate"
            type="datetime-local"
            required
          >

          <button type="submit">Salva</button>
        </form>

        <ul id="remindersList"></ul>
      </div>
    </section>

    <section class="box">
      <h2>Ricerche</h2>
      <div id="searchResults">
        <p class="empty">Nessuna ricerca</p>
      </div>
    </section>
  </main>

  <script>
    const commandForm = document.getElementById("commandForm");
    const commandInput = document.getElementById("commandInput");
    const response = document.getElementById("response");

    const noteForm = document.getElementById("noteForm");
    const noteInput = document.getElementById("noteInput");
    const notesList = document.getElementById("notesList");

    const reminderForm = document.getElementById("reminderForm");
    const reminderInput = document.getElementById("reminderInput");
    const reminderDate = document.getElementById("reminderDate");
    const remindersList = document.getElementById("remindersList");

    const searchResults = document.getElementById("searchResults");

    let notes = JSON.parse(localStorage.getItem("notes") || "[]");

    let reminders = JSON.parse(
      localStorage.getItem("reminders") || "[]"
    );

    function showResponse(message) {
      response.textContent = message;
    }

    function saveNotes() {
      localStorage.setItem("notes", JSON.stringify(notes));
    }

    function saveReminders() {
      localStorage.setItem(
        "reminders",
        JSON.stringify(reminders)
      );
    }

    function renderNotes() {
      notesList.innerHTML = "";

      if (notes.length === 0) {
        notesList.innerHTML =
          '<li class="empty">Nessuna nota</li>';
        return;
      }

      notes.forEach((note) => {
        const li = document.createElement("li");

        li.innerHTML = `
          <div class="content">
            ${escapeHtml(note.text)}
            <span class="date">
              ${new Date(note.createdAt).toLocaleString("it-IT")}
            </span>
          </div>

          <button class="delete">Elimina</button>
        `;

        li.querySelector(".delete").onclick = () => {
          notes = notes.filter((item) => item.id !== note.id);
          saveNotes();
          renderNotes();
          showResponse("Nota eliminata");
        };

        notesList.appendChild(li);
      });
    }

    function renderReminders() {
      remindersList.innerHTML = "";

      if (reminders.length === 0) {
        remindersList.innerHTML =
          '<li class="empty">Nessun promemoria</li>';
        return;
      }

      reminders
        .sort((a, b) => new Date(a.date) - new Date(b.date))
        .forEach((reminder) => {
          const li = document.createElement("li");

          li.innerHTML = `
            <div class="content">
              ${escapeHtml(reminder.text)}
              <span class="date">
                ${new Date(reminder.date).toLocaleString("it-IT")}
              </span>
            </div>

            <button class="delete">Elimina</button>
          `;

          li.querySelector(".delete").onclick = () => {
            reminders = reminders.filter(
              (item) => item.id !== reminder.id
            );

            saveReminders();
            renderReminders();
            showResponse("Promemoria eliminato");
          };

          remindersList.appendChild(li);
        });
    }

    commandForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const command = commandInput.value.trim();

      if (!command) return;

      processCommand(command);
      commandInput.value = "";
    });

    noteForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = noteInput.value.trim();

      if (!text) return;

      notes.push({
        id: crypto.randomUUID(),
        text,
        createdAt: new Date().toISOString()
      });

      saveNotes();
      renderNotes();

      noteInput.value = "";
      showResponse("Nota salvata");
    });

    reminderForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const text = reminderInput.value.trim();
      const date = reminderDate.value;

      if (!text || !date) return;

      reminders.push({
        id: crypto.randomUUID(),
        text,
        date,
        notified: false
      });

      saveReminders();
      renderReminders();

      reminderInput.value = "";
      reminderDate.value = "";

      showResponse("Promemoria salvato");
    });

    function processCommand(command) {
      const text = command.toLowerCase().trim();

      if (
        text.startsWith("crea una nota") ||
        text.startsWith("crea nota") ||
        text.startsWith("annota")
      ) {
        const note = text
          .replace(/^crea una nota\s*:?\s*/i, "")
          .replace(/^crea nota\s*:?\s*/i, "")
          .replace(/^annota\s*:?\s*/i, "")
          .trim();

        if (!note) {
          showResponse("Scrivi il testo della nota");
          return;
        }

        notes.push({
          id: crypto.randomUUID(),
          text: note,
          createdAt: new Date().toISOString()
        });

        saveNotes();
        renderNotes();
        showResponse("Nota salvata");
        return;
      }

      if (
        text.startsWith("ricordami") ||
        text.startsWith("crea promemoria") ||
        text.startsWith("crea un promemoria")
      ) {
        const reminderText = text
          .replace(/^ricordami\s*/i, "")
          .replace(/^crea promemoria\s*/i, "")
          .replace(/^crea un promemoria\s*/i, "")
          .replace(/^di\s*/i, "")
          .trim();

        if (!reminderText) {
          showResponse("Scrivi il testo del promemoria");
          return;
        }

        reminders.push({
          id: crypto.randomUUID(),
          text: reminderText,
          date: parseDate(text),
          notified: false
        });

        saveReminders();
        renderReminders();
        showResponse("Promemoria salvato");
        return;
      }

      if (
        text.includes("leggi le note") ||
        text.includes("mostra le note")
      ) {
        if (notes.length === 0) {
          showResponse("Non ci sono note");
        } else {
          showResponse(
            notes.map((note) => note.text).join(" | ")
          );
        }

        return;
      }

      if (
        text.startsWith("cerca") ||
        text.startsWith("ricerca")
      ) {
        const query = text
          .replace(/^cerca su internet\s*/i, "")
          .replace(/^cerca\s*/i, "")
          .replace(/^ricerca\s*/i, "")
          .trim();

        if (!query) {
          showResponse("Scrivi cosa vuoi cercare");
          return;
        }

        searchWeb(query);
        return;
      }

      if (text.includes("apri google")) {
        window.open("https://www.google.com", "_blank");
        showResponse("Google aperto");
        return;
      }

      if (text.includes("apri youtube")) {
        window.open("https://www.youtube.com", "_blank");
        showResponse("YouTube aperto");
        return;
      }

      showResponse(
        "Comando non riconosciuto"
      );
    }

    function searchWeb(query) {
      const url =
        "https://www.google.com/search?q=" +
        encodeURIComponent(query);

      const empty = searchResults.querySelector(".empty");

      if (empty) {
        empty.remove();
      }

      const result = document.createElement("div");

      result.innerHTML = `
        <p>${escapeHtml(query)}</p>
        <a href="${url}" target="_blank">
          Apri ricerca
        </a>
      `;

      searchResults.prepend(result);
      window.open(url, "_blank");
      showResponse("Ricerca avviata");
    }

    function parseDate(command) {
      const date = new Date();

      if (command.includes("domani")) {
        date.setDate(date.getDate() + 1);
      }

      const match = command.match(
        /alle\s+(\d{1,2})(?:[:.](\d{2}))?/
      );

      if (match) {
        date.setHours(
          Number(match[1]),
          Number(match[2] || 0),
          0,
          0
        );
      } else {
        date.setHours(date.getHours() + 1, 0, 0, 0);
      }

      const offset = date.getTimezoneOffset();
      const localDate = new Date(
        date.getTime() - offset * 60000
      );

      return localDate.toISOString().slice(0, 16);
    }

    function checkReminders() {
      const now = new Date();
      let changed = false;

      reminders.forEach((reminder) => {
        if (
          !reminder.notified &&
          new Date(reminder.date) <= now
        ) {
          reminder.notified = true;
          changed = true;

          alert("Promemoria: " + reminder.text);
          showResponse("Promemoria: " + reminder.text);
        }
      });

      if (changed) {
        saveReminders();
        renderReminders();
      }
    }

    function escapeHtml(value) {
      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    renderNotes();
    renderReminders();

    setInterval(checkReminders, 10000);
    checkReminders();
  </script>
</body>
</html>
