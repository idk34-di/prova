<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Viewer</title>

<link id="hljs-theme" rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<style>
  :root{
    --bg:#0a0a0c;
    --panel:#131316;
    --panel-2:#0e0e11;
    --border:#2a2a30;
    --text:#e8e6df;
    --dim:#8a8a92;
    --accent:#ffb020;
    --led-off:#3a2f18;
    --radius:6px;
  }
  html.light{
    --bg:#f8f6f1;
    --panel:#ffffff;
    --panel-2:#f1efe9;
    --border:#e3dfd6;
    --text:#1b1a17;
    --dim:#6b6860;
    --accent:#c9720a;
    --led-off:#d6c9a3;
  }

  *{box-sizing:border-box}
  body{
    margin:0; font-family: ui-monospace, "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    background:var(--bg); color:var(--text); min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }

  .wrap{max-width:1100px;margin:18px auto;padding:18px}

  header{
    display:flex;align-items:center;justify-content:space-between;
    gap:12px;padding:12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);
  }
  .brand h1{margin:0;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
  .brand .sub{font-size:11px;color:var(--dim);margin-top:4px}

  .controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0;padding:12px;border-radius:8px;background:var(--panel);border:1px solid var(--border)}
  .controls .grp{display:flex;align-items:center;gap:8px}
  .controls label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  select{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px;border-radius:6px;font-size:13px}
  button{background:transparent;border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  .spacer{flex:1}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:820px){.panels{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;min-height:420px}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);font-size:11px;color:var(--dim);text-transform:uppercase}
  .led{width:8px;height:8px;border-radius:50%;background:var(--led-off);display:inline-block}
  .led.on{background:var(--accent);box-shadow:0 0 8px var(--accent)}

  textarea{flex:1;border:0;background:transparent;color:var(--text);padding:14px;font-family:inherit;font-size:13px;line-height:1.6;resize:none}
  textarea:focus{outline:none}

  .out-wrap{flex:1;overflow:auto;background:transparent}
  pre{margin:0}
  pre code.hljs{display:block;padding:14px;font-size:13px;line-height:1.6;background:transparent!important}

  footer{margin-top:14px;text-align:center;color:var(--dim);font-size:12px}
  .note {font-size:13px;color:var(--dim);padding:8px 12px;border-radius:6px}

  /* small icon button styles */
  .icon-btn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:6px;padding:6px}
  .icon-btn svg{width:18px;height:18px;fill:currentColor}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div>
          <h1>Code Viewer</h1>
          <div class="sub">incolla · evidenzia · esporta</div>
        </div>
      </div>
      <div style="display:flex;gap:10px;align-items:center">
        <div id="langColorSwatch" style="width:14px;height:14px;border-radius:4px;border:1px solid var(--border)"></div>
        <button id="themeBtn" type="button">☾ Theme</button>
      </div>
    </header>

    <div class="controls" role="region" aria-label="controls">
      <div class="grp">
        <label for="lang">Linguaggio</label>
        <select id="lang">
          <option value="auto">Auto-rileva</option>
          <option value="javascript">JavaScript</option>
          <option value="typescript">TypeScript</option>
          <option value="python">Python</option>
          <option value="cpp">C / C++ (Arduino)</option>
          <option value="java">Java</option>
          <option value="csharp">C#</option>
          <option value="go">Go</option>
          <option value="rust">Rust</option>
          <option value="php">PHP</option>
          <option value="ruby">Ruby</option>
          <option value="swift">Swift</option>
          <option value="kotlin">Kotlin</option>
          <option value="html">HTML</option>
          <option value="css">CSS</option>
          <option value="json">JSON</option>
          <option value="yaml">YAML</option>
          <option value="sql">SQL</option>
          <option value="bash">Bash</option>
          <option value="markdown">Markdown</option>
        </select>
      </div>

      <div class="grp">
        <label for="syntaxTheme">Colori</label>
        <select id="syntaxTheme">
          <option value="github-dark">GitHub Dark</option>
          <option value="github">GitHub Light</option>
          <option value="monokai">Monokai</option>
          <option value="dracula">Dracula</option>
          <option value="atom-one-dark">Atom One Dark</option>
          <option value="nord">Nord</option>
          <option value="vs">Visual Studio</option>
          <option value="xcode">Xcode</option>
          <option value="solarized-dark">Solarized Dark</option>
          <option value="tomorrow-night">Tomorrow Night</option>
        </select>
      </div>

      <div class="spacer"></div>

      <button id="copyBtn" type="button">↓ Copia HTML</button>
      <div id="htmlNote" class="note" style="display:none">Per codice HTML: seleziona e copia dal pannello di output.</div>

      <button id="clearBtn" class="icon-btn" title="Svuota" type="button" aria-label="Svuota">
        <!-- cestino SVG -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M9 3h6v2h5v2H4V5h5V3zm1 6v8h2v-8H10zm4 0v8h2v-8h-2zM7 7h10l-1 12H8L7 7z"/>
        </svg>
      </button>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="bar"><span>Input</span><span class="led" id="inLed"></span></div>
        <textarea id="input" spellcheck="false" placeholder="Incolla qui il tuo codice..."></textarea>
      </div>

      <div class="panel">
        <div class="bar"><span>Output</span><span class="led" id="outLed"></span></div>
        <div class="out-wrap"><pre><code id="output" class="hljs"></code></pre></div>
      </div>
    </div>

    <footer>© 2026 · Code Viewer — evidenziazione sintassi locale, nessun dato inviato altrove</footer>
  </div>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const langSel = document.getElementById('lang');
  const themeSel = document.getElementById('syntaxTheme');
  const themeLink = document.getElementById('hljs-theme');
  const inLed = document.getElementById('inLed');
  const outLed = document.getElementById('outLed');
  const themeBtn = document.getElementById('themeBtn');
  const copyBtn = document.getElementById('copyBtn');
  const htmlNote = document.getElementById('htmlNote');
  const clearBtn = document.getElementById('clearBtn');
  const langColorSwatch = document.getElementById('langColorSwatch');

  // mappa colori per linguaggi (accent)
  const languageColors = {
    javascript: '#f7df1e',
    typescript: '#3178c6',
    python: '#3572A5',
    cpp: '#f34b7d',
    java: '#b07219',
    csharp: '#178600',
    go: '#00add8',
    rust: '#dea584',
    php: '#4F5D95',
    ruby: '#701516',
    swift: '#ff6e52',
    kotlin: '#A97BFF',
    html: '#e34c26',
    css: '#2965f1',
    json: '#292929',
    yaml: '#cb171e',
    sql: '#e38c00',
    bash: '#89e051',
    markdown: '#083fa1'
  };

  function setAccentColorFromLang(lang) {
    const c = languageColors[lang] || getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    document.documentElement.style.setProperty('--accent', c);
    if (langColorSwatch) langColorSwatch.style.background = c;
  }

  function render() {
    const code = input.value || '';
    inLed.classList.toggle('on', code.trim().length > 0);

    if (!code.trim()) {
      output.textContent = '';
      output.className = 'hljs';
      outLed.classList.remove('on');
      return;
    }

    let result;
    const chosen = langSel.value;
    try {
      if (chosen === 'auto') {
        result = hljs.highlightAuto(code);
      } else {
        result = hljs.highlight(code, { language: chosen, ignoreIllegals: true });
      }
    } catch (e) {
      result = hljs.highlightAuto(code);
    }

    output.innerHTML = result.value;
    output.className = 'hljs language-' + (result.language || chosen);
    outLed.classList.add('on');

    // se la lingua è html: nascondi il tasto copia e mostra una nota semplice
    if ((chosen === 'html')) {
      copyBtn.style.display = 'none';
      htmlNote.style.display = 'inline-block';
    } else {
      copyBtn.style.display = '';
      htmlNote.style.display = 'none';
    }

    // aggiorna accento in base alla lingua
    setAccentColorFromLang(chosen === 'auto' ? (result.language || 'javascript') : chosen);
  }

  input.addEventListener('input', render);
  langSel.addEventListener('change', render);

  themeSel.addEventListener('change', () => {
    themeLink.href = 'https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/' + themeSel.value + '.min.css';
  });

  themeBtn.addEventListener('click', () => {
    document.documentElement.classList.toggle('light');
    themeBtn.textContent = document.documentElement.classList.contains('light') ? '☀ Theme' : '☾ Theme';
  });

  // copia HTML *senza* sfondo: inlined solo i colori foreground, rimuove background
  copyBtn.addEventListener('click', async () => {
    // se output vuoto, niente da copiare
    if (!output.innerHTML.trim()) return;

    // crea clone e mettilo in un container nascosto per poter leggere computedStyle
    const clone = output.cloneNode(true);
    const wrapper = document.createElement('div');
    wrapper.style.position = 'absolute';
    wrapper.style.left = '-9999px';
    wrapper.style.top = '0';
    wrapper.style.visibility = 'hidden';
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    // funzione ricorsiva per inlinare il colore (foreground) e rimuovere background
    function inlineColors(el) {
      if (el.nodeType !== 1) return;
      const cs = getComputedStyle(el);
      // applica solo il colore (foreground)
      if (cs.color) {
        el.style.color = cs.color;
      }
      // rimuovi background styles
      el.style.background = 'transparent';
      el.style.backgroundColor = 'transparent';
      el.removeAttribute('class'); // togli classi per evitare css esterni
      // procedi figli
      for (let i = 0; i < el.children.length; i++) inlineColors(el.children[i]);
    }
    inlineColors(clone);

    // avvolgi in pre/code minimali e copia outerHTML
    const resultHTML = '<pre><code style="background:transparent;border-radius:0;padding:0;margin:0;display:block">' + clone.innerHTML + '</code></pre>';

    try {
      await navigator.clipboard.writeText(resultHTML);
      const old = copyBtn.textContent;
      copyBtn.textContent = 'Copiato ✓';
      setTimeout(()=> copyBtn.textContent = old, 1300);
    } catch(e){
      // fallback: seleziona e copia tramite execCommand
      const ta = document.createElement('textarea');
      ta.value = resultHTML;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      const old = copyBtn.textContent;
      copyBtn.textContent = 'Copiato ✓';
      setTimeout(()=> copyBtn.textContent = old, 1300);
    } finally {
      document.body.removeChild(wrapper);
    }
  });

  // svuota: icona cestino
  clearBtn.addEventListener('click', () => {
    input.value = '';
    render();
    input.focus();
  });

  // demo iniziale
  input.value = `#include <Arduino.h>

void setup() {
  Serial.begin(115200);
  pinMode(LED_BUILTIN, OUTPUT);
}

void loop() {
  digitalWrite(LED_BUILTIN, HIGH);
  delay(500);
  digitalWrite(LED_BUILTIN, LOW);
  delay(500);
}`;
  langSel.value = 'cpp';
  render();
</script>
</body>
</html>
