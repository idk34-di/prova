<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grana</title>
<style>
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#fff;color:#111;line-height:1.5}
header{position:sticky;top:0;background:#fff;display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid #eee;z-index:10}
header h1{font-size:20px;font-weight:600;letter-spacing:.5px}
#burger{font-size:26px;background:none;border:0;cursor:pointer;line-height:1}
#menu{position:fixed;top:0;left:-260px;width:260px;height:100%;background:#fff;border-right:1px solid #eee;padding:70px 0 20px;transition:left .25s;z-index:30}
#menu.open{left:0}
#menu a{display:block;padding:14px 24px;color:#111;text-decoration:none;cursor:pointer}
#menu a:hover{background:#f5f5f5}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:20}
#overlay.open{display:block}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h2{font-weight:600;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;display:block;background:#f2f2f2}
.luoghi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.luoghi button{padding:8px 16px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer;font-size:15px}
.luoghi button.on{background:#111;color:#fff;border-color:#111}
.card{border:1px solid #eee;padding:16px;margin-bottom:12px;border-radius:8px}
.card b{display:block}
form{display:flex;flex-direction:column;gap:10px;max-width:360px}
input,button.btn{padding:12px;font-size:16px;border:1px solid #ccc;border-radius:6px}
button.btn{background:#111;color:#fff;border-color:#111;cursor:pointer}
#lightbox{display:none;position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:16px}
#lightbox.open{display:block}
#lightbox img{max-width:100%;max-height:75vh;display:block;margin:0 auto}
#lightbox .info{max-width:700px;margin:14px auto;font-size:14px;color:#444}
#chiudi{position:fixed;top:10px;right:16px;font-size:32px;background:none;border:0;cursor:pointer}
</style>
</head>
<body>

<header>
  <button id="burger" aria-label="Menu">☰</button>
  <h1>Grana</h1>
</header>

<nav id="menu">
  <a data-v="foto">Foto</a>
  <a data-v="attrezzatura">Attrezzatura</a>
  <a data-v="luoghi">Luoghi</a>
  <a data-v="accedi">Accedi / Registrati</a>
  <a data-v="contatti">Contatti</a>
  <a data-v="chisono">Chi sono</a>
</nav>
<div id="overlay"></div>

<main id="app"></main>

<div id="lightbox">
  <button id="chiudi">×</button>
  <img id="lbImg" alt="">
  <div class="info" id="lbInfo"></div>
</div>

<script>
/* ====== I TUOI DATI: modifica qui ====== */
const FOTO = [
  {src:"foto/roma1.jpg", titolo:"Fori Imperiali", luogo:"Roma", data:"2026-05-12",
   camera:"Nome fotocamera", obiettivo:"50mm f/1.8", focale:"50mm", apertura:"f/8", tempo:"1/250", iso:"100"},
  {src:"foto/roma2.jpg", titolo:"Tramonto sul Tevere", luogo:"Roma", data:"2026-05-13",
   camera:"Nome fotocamera", obiettivo:"50mm f/1.8", focale:"50mm", apertura:"f/4", tempo:"1/125", iso:"200"},
  {src:"foto/milano1.jpg", titolo:"Duomo", luogo:"Milano", data:"2026-06-02",
   camera:"Nome fotocamera", obiettivo:"28mm f/2.8", focale:"28mm", apertura:"f/5.6", tempo:"1/200", iso:"100"}
];

const ATTREZZATURA = {
  fotocamere: [{nome:"La tua fotocamera", note:"Descrizione, anno, pellicola/digitale…"}],
  obiettivi:  [{nome:"Obiettivo 1", note:"es. 50mm f/1.8"},
               {nome:"Obiettivo 2", note:"es. 28mm f/2.8"}]
};

const CONTATTI_EMAIL = "tua@email.it";
const CHI_SONO = "Qui scrivi tu la tua descrizione.";
/* Iscrizione: crea un account gratuito su buttondown.com e sostituisci TUOUSERNAME */
const NEWSLETTER_URL = "https://buttondown.com/api/emails/embed-subscribe/TUOUSERNAME";
/* ======================================= */

const app = document.getElementById("app");
const menu = document.getElementById("menu");
const overlay = document.getElementById("overlay");
let luogoSel = null;

function toggleMenu(open){
  menu.classList.toggle("open", open);
  overlay.classList.toggle("open", open);
}
document.getElementById("burger").onclick = () => toggleMenu(!menu.classList.contains("open"));
overlay.onclick = () => toggleMenu(false);
menu.querySelectorAll("a").forEach(a => a.onclick = () => { vai(a.dataset.v); toggleMenu(false); });

function griglia(lista){
  return '<div class="grid">' + lista.map(f =>
    `<img loading="lazy" src="${f.src}" alt="${f.titolo}" data-src="${f.src}">`).join("") + '</div>';
}
function attivaClick(lista){
  app.querySelectorAll(".grid img").forEach(img => {
    img.onclick = () => apriFoto(lista.find(f => f.src === img.dataset.src));
  });
}
function apriFoto(f){
  document.getElementById("lbImg").src = f.src;
  document.getElementById("lbInfo").innerHTML =
    `<h3>${f.titolo}</h3><p>📍 ${f.luogo} · ${f.data}</p>
     <p>📷 ${f.camera} · ${f.obiettivo}<br>
     Focale ${f.focale} · ${f.apertura} · ${f.tempo} · ISO ${f.iso}</p>`;
  document.getElementById("lightbox").classList.add("open");
}
document.getElementById("chiudi").onclick = () =>
  document.getElementById("lightbox").classList.remove("open");

function vai(v){
  if(v==="foto"){
    app.innerHTML = "<h2>Foto</h2>" + griglia(FOTO);
    attivaClick(FOTO);
  }
  else if(v==="attrezzatura"){
    const blocco = (t, arr) => `<h3 style="margin:18px 0 10px">${t}</h3>` +
      arr.map(x => `<div class="card"><b>${x.nome}</b>${x.note}</div>`).join("");
    app.innerHTML = "<h2>Attrezzatura</h2>" +
      blocco("Fotocamere", ATTREZZATURA.fotocamere) + blocco("Obiettivi", ATTREZZATURA.obiettivi);
  }
  else if(v==="luoghi"){
    const luoghi = [...new Set(FOTO.map(f => f.luogo))].sort();
    if(!luogoSel) luogoSel = luoghi[0];
    const lista = FOTO.filter(f => f.luogo === luogoSel);
    app.innerHTML = "<h2>Luoghi</h2><div class='luoghi'>" +
      luoghi.map(l => `<button class="${l===luogoSel?'on':''}" data-l="${l}">${l}</button>`).join("") +
      "</div>" + griglia(lista);
    app.querySelectorAll(".luoghi button").forEach(b => b.onclick = () => { luogoSel = b.dataset.l; vai("luoghi"); });
    attivaClick(lista);
  }
  else if(v==="accedi"){
    app.innerHTML = `<h2>Accedi o registrati</h2>
      <p style="margin-bottom:16px">Inserisci la tua e-mail: ti avviserò ogni volta che carico nuove foto.</p>
      <form action="${NEWSLETTER_URL}" method="post" target="_blank">
        <input type="email" name="email" placeholder="La tua e-mail" required>
        <button class="btn" type="submit">Iscriviti</button>
      </form>`;
  }
  else if(v==="contatti"){
    app.innerHTML = `<h2>Contatti</h2><p><a href="mailto:${CONTATTI_EMAIL}">${CONTATTI_EMAIL}</a></p>`;
  }
  else if(v==="chisono"){
    app.innerHTML = `<h2>Chi sono</h2><p>${CHI_SONO}</p>`;
  }
  window.scrollTo(0,0);
}
vai("foto");
</script>
</body>
</html>
